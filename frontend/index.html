  <!-- React 18 and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<body class="min-h-screen flex flex-col antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ── Markdown Parser with Fallback ──
    function renderFormattedMarkdown(text) {
      if (!text) return '';
      try {
        if (window.marked && window.DOMPurify) {
          const raw = window.marked.parse(text, { breaks: true, gfm: true });
          return window.DOMPurify.sanitize(raw);
        }
      } catch (err) {
        console.warn('Marked parsing error, using fallback:', err);
      }

      // Built-in fallback renderer (eliminates ###, **, *, etc.)
      let h = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Code blocks
      h = h.replace(/```([a-zA-Z0-9_]*)\n([\s\S]*?)```/g, (m, lang, code) => (
        `<pre><code>${code.trim()}</code></pre>`
      ));
      // Inline code
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headings
      h = h.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
      h = h.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      h = h.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      h = h.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold & Italic
      h = h.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Bullet lists
      h = h.replace(/^[\*\-] (.*$)/gim, '<li class="ml-4 list-disc">$1</li>');
      // Numbered lists
      h = h.replace(/^(\d+)\. (.*$)/gim, '<li class="ml-4 list-decimal">$2</li>');

      // Paragraph wrapping
      const chunks = h.split(/\n\n+/);
      return chunks.map(chunk => {
        const trimmed = chunk.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('<h') || trimmed.startsWith('<pre') || trimmed.startsWith('<li')) {
          return trimmed;
        }
        return `<p>${trimmed.replace(/\n/g, '<br />')}</p>`;
      }).join('');
    }

    // ── API Service ──
    const api = {
      dispatch: async (command) => {
        const res = await fetch('/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command, context: {} })
        });
        if (res.status === 422) {
          const err = await res.json();
          throw { isClarification: true, ...err };
        }
        if (res.status === 503) {
          const err = await res.json();
          throw { isCircuitOpen: true, ...err };
        }
        if (!res.ok) {
          let errText = res.statusText;
          try { const j = await res.json(); errText = j.detail || errText; } catch {}
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        return res.json();
      },
      startPipeline: async (name, command) => {
        const res = await fetch(`/pipeline/${name}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        return res.json();
      },
      getRun: async (runId) => {
        const res = await fetch(`/runs/${runId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      getApprovals: async (status) => {
        const q = status && status !== 'all' ? `?status=${encodeURIComponent(status)}` : '';
        const res = await fetch(`/approvals${q}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      approve: async (id) => {
        const res = await fetch(`/approvals/${id}/approve`, { method: 'POST' });
        return res.json();
      },
      reject: async (id) => {
        const res = await fetch(`/approvals/${id}/reject`, { method: 'POST' });
        return res.json();
      },
      execute: async (id) => {
        const res = await fetch(`/approvals/${id}/execute`, { method: 'POST' });
        return res.json();
      },
      getEval: async () => {
        const res = await fetch('/router/eval');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      triggerEval: async () => {
        const res = await fetch('/router/eval', { method: 'POST' });
        return res.json();
      },
      getCircuit: async () => {
        const res = await fetch('/system/circuit');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      resetCircuit: async () => {
        const res = await fetch('/system/circuit/reset', { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
    };

    // ── Accessible Status Pill ──
    function StatusPill({ status, size = 'md' }) {
      const s = (status || '').toLowerCase();
      let bg = 'bg-slate-100 text-slate-700 border border-slate-300';
      let dot = 'bg-slate-400';
      let label = s.toUpperCase();

      if (s === 'pending') {
        bg = 'bg-amber-50 text-amber-800 border border-amber-300 font-bold';
        dot = 'bg-amber-500 animate-pulse';
      } else if (s === 'approved' || s === 'completed' || s === 'executed' || s === 'closed' || s === 'ok') {
        bg = 'bg-emerald-50 text-emerald-800 border border-emerald-300 font-bold';
        dot = 'bg-emerald-600';
      } else if (s === 'rejected' || s === 'failed' || s === 'open') {
        bg = 'bg-red-50 text-red-800 border border-red-300 font-bold';
        dot = 'bg-red-500';
      }

      const sizeClasses = size === 'sm' ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs';

      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full font-mono ${sizeClasses} ${bg}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dot}`} />
          <span>{label}</span>
        </span>
      );
    }

    // ── VIEW 1: DISPATCH & AGENT STUDIO ──
    function DispatchView() {
      const [command, setCommand] = useState("");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [clarification, setClarification] = useState(null);
      const [viewMode, setViewMode] = useState('formatted'); // 'formatted' | 'raw'
      const [copied, setCopied] = useState(false);
      const [history, setHistory] = useState([
        { cmd: "Tell me about Farhan Aaqil's featured projects and research", agent: "info_agent", time: "Just now" },
        { cmd: "Tailor my resume for Machine Learning Engineer", agent: "career_agent", time: "Just now" },
        { cmd: "Search arXiv papers on multi-agent consensus", agent: "research_agent", time: "5m ago" }
      ]);

      const presets = [
        { label: "ℹ️ Farhan Aaqil's Projects & Research", cmd: "Tell me about Farhan Aaqil's featured projects, research papers, and technical background." },
        { label: "⚙️ How Orchestrator System Works", cmd: "Explain how the Orchestrator Agent works, its architecture, safety gates, and agents." },
        { label: "💬 Common Talk / General Help", cmd: "Hi! Who are you and how can you help me today?" },
        { label: "💼 Tailor Resume for ML Engineer", cmd: "Tailor my resume bullets for a Senior Machine Learning Engineer position at Anthropic." },
        { label: "🔬 ArXiv Research Synthesis", cmd: "Search arXiv for recent papers on LLM hallucination mitigation and summarize methodology." },
        { label: "✍️ Write Technical Devlog", cmd: "Draft a technical deep-dive on zero-parameter approval gates with SQLite CAS concurrency." },
        { label: "⚠️ Trigger Clarification (422)", cmd: "What should I do next?" }
      ];

      const handleExecute = async (cmdOverride) => {
        const cmdToRun = cmdOverride || command;
        if (!cmdToRun.trim()) return;

        setLoading(true);
        setError(null);
        setClarification(null);

        try {
          const data = await api.dispatch(cmdToRun);
          setResult(data);
          setHistory(prev => [{ cmd: cmdToRun, agent: data.agent, time: "Just now" }, ...prev.slice(0, 5)]);
        } catch (err) {
          if (err.isClarification) {
            setClarification(err.detail || err);
          } else if (err.isCircuitOpen) {
            setError(`Circuit Breaker OPEN: Service is temporarily unavailable or cooling down. ${err.detail || ''}`);
          } else {
            setError(err.message || "Execution failed.");
          }
        } finally {
          setLoading(false);
        }
      };

      const copyOutput = () => {
        if (!result?.output) return;
        navigator.clipboard.writeText(result.output);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const formattedHtml = useMemo(() => {
        return renderFormattedMarkdown(result?.output || '');
      }, [result?.output]);

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-silver-500/40 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                <span>⚡</span> Dispatch & Agent Studio
              </h2>
              <p className="text-sm text-silver-800 mt-1">
                Natural-language command classifier and agent execution console with zero-leakage safety barriers.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono text-silver-800">Threshold:</span>
              <span className="px-2.5 py-1 rounded-md bg-white border border-silver-400 text-accent-primary font-mono text-xs font-bold shadow-xs">
                ≥ 0.60
              </span>
            </div>
          </div>

          {/* Main 2-Column Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Console (8 Cols) */}
            <div className="lg:col-span-8 space-y-5">
              {/* Command Input Box */}
              <div className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase tracking-wider text-accent-primary font-mono flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-accent-primary animate-ping" />
                    Prompt Input Console
                  </span>
                  <span className="text-[11px] text-silver-700 font-mono">Press ↵ Enter to Dispatch</span>
                </div>

                <div className="relative">
                  <textarea
                    value={command}
                    onChange={e => setCommand(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleExecute();
                      }
                    }}
                    placeholder="Enter your prompt or question (e.g., 'Tell me about Farhan Aaqil's projects', 'Tailor my resume')..."
                    rows={3}
                    className="w-full bg-silver-50 border border-silver-300 rounded-xl p-4 text-sm text-silver-900 placeholder:text-silver-500 focus:outline-none focus:border-accent-primary focus:bg-white focus:ring-1 focus:ring-accent-primary transition-all resize-none shadow-inner"
                  />
                  <div className="absolute right-3 bottom-3.5 flex items-center gap-2">
                    {command && (
                      <button
                        onClick={() => setCommand('')}
                        className="text-xs text-silver-600 hover:text-silver-900 px-2 py-1 rounded transition-all"
                      >
                        Clear
                      </button>
                    )}
                    <button
                      onClick={() => handleExecute()}
                      disabled={loading || !command.trim()}
                      className="px-4 py-2 rounded-lg bg-accent-primary hover:bg-accent-hover text-white font-bold text-xs shadow-md shadow-accent-primary/20 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      {loading ? (
                        <>
                          <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                          <span>Routing...</span>
                        </>
                      ) : (
                        <>
                          <span>Dispatch</span>
                          <span>&rarr;</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>

                {/* Preset Prompts Chips */}
                <div className="space-y-2 pt-1 border-t border-silver-200">
                  <span className="text-[11px] font-mono text-silver-700 uppercase tracking-wider block">Quick-Start Commands:</span>
                  <div className="flex flex-wrap gap-2">
                    {presets.map((p, i) => (
                      <button
                        key={i}
                        onClick={() => {
                          setCommand(p.cmd);
                          handleExecute(p.cmd);
                        }}
                        className="px-2.5 py-1.5 rounded-lg bg-silver-100 hover:bg-silver-200 border border-silver-300 text-xs text-silver-800 hover:text-silver-950 transition-all text-left font-medium"
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Error Alert */}
              {error && (
                <div className="bg-red-50 border border-red-200 rounded-xl p-4 text-xs font-mono text-red-900 flex items-start gap-3 shadow-sm">
                  <span className="text-base text-red-600">⚠️</span>
                  <div className="flex-1 space-y-1">
                    <span className="font-bold text-red-700 uppercase tracking-wider block">Execution Notice</span>
                    <p className="text-red-800">{error}</p>
                  </div>
                  <button onClick={() => setError(null)} className="text-red-500 hover:text-red-700 font-bold">✕</button>
                </div>
              )}

              {/* Clarification Prompt Card (422) */}
              {clarification && (
                <div className="bg-amber-50 border border-amber-300 rounded-2xl p-5 shadow-sm space-y-4">
                  <div className="flex items-center gap-2.5 text-amber-900 font-bold text-sm">
                    <span>⚠️</span>
                    <span>Clarification Needed (Confidence Below 60%)</span>
                  </div>
                  <p className="text-xs text-amber-800 font-mono">
                    {clarification.reasoning || "The router could not definitively classify your intent. Please select the intended target agent:"}
                  </p>
                  <div className="flex flex-wrap gap-2.5 pt-2">
                    {(clarification.candidates || []).map(agent => (
                      <button
                        key={agent}
                        onClick={() => handleExecute(`[For ${agent}] ${command}`)}
                        className="px-3.5 py-2 rounded-xl bg-white hover:bg-accent-primary hover:text-white border border-amber-300 text-xs font-mono font-bold text-accent-primary transition-all flex items-center gap-2 shadow-xs"
                      >
                        <span>🎯 Re-route to:</span>
                        <span className="underline">{agent}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Formatted Convenient Output Deck */}
              {result && (
                <div className="bg-white rounded-2xl p-6 shadow-md border border-silver-400/80 space-y-5 transition-all">
                  {/* Output Header Bar */}
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-silver-200 pb-4">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-emerald-100 border border-emerald-200 flex items-center justify-center text-emerald-700 font-bold text-base shadow-xs">
                        ✓
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-mono font-bold uppercase tracking-wider text-silver-700">Dispatched Agent:</span>
                          <span className="font-mono font-extrabold text-xs px-2.5 py-1 rounded-md bg-silver-900 text-white shadow-xs">
                            {result.agent}
                          </span>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      {/* View Mode Toggle: Formatted vs Raw */}
                      <div className="flex bg-silver-100 p-1 rounded-lg border border-silver-300 text-xs">
                        <button
                          onClick={() => setViewMode('formatted')}
                          className={`px-3 py-1 rounded-md font-medium transition-all ${
                            viewMode === 'formatted'
                              ? 'bg-white text-silver-900 shadow-xs font-bold'
                              : 'text-silver-700 hover:text-silver-900'
                          }`}
                        >
                          ✨ Formatted
                        </button>
                        <button
                          onClick={() => setViewMode('raw')}
                          className={`px-3 py-1 rounded-md font-medium font-mono transition-all ${
                            viewMode === 'raw'
                              ? 'bg-white text-silver-900 shadow-xs font-bold'
                              : 'text-silver-700 hover:text-silver-900'
                          }`}
                        >
                          📄 Raw
                        </button>
                      </div>

                      {/* Copy Button */}
                      <button
                        onClick={copyOutput}
                        className={`px-3.5 py-1.5 rounded-lg border text-xs font-medium transition-all flex items-center gap-1.5 ${
                          copied
                            ? 'bg-emerald-50 border-emerald-300 text-emerald-700 font-bold'
                            : 'bg-silver-50 hover:bg-silver-100 border-silver-300 text-silver-800'
                        }`}
                      >
                        <span>{copied ? '✓ Copied!' : '📋 Copy'}</span>
                      </button>
                    </div>
                  </div>

                  {/* Body: Formatted Rich Text (NO raw symbols!) */}
                  {viewMode === 'formatted' ? (
                    <div
                      className="prose-output bg-silver-50/70 rounded-xl p-6 border border-silver-200 max-h-[600px] overflow-y-auto shadow-inner"
                      dangerouslySetInnerHTML={{ __html: formattedHtml }}
                    />
                  ) : (

          if (action === 'approve') await api.approve(id);
          if (action === 'reject') await api.reject(id);

          alert('Action failed: ' + err.message);

      return (
        <div className="space-y-6">

                  <span>🛡️</span> Human-in-the-Loop Safety Gate

                    className={`px-3 py-1.5 rounded-lg text-xs font-mono uppercase font-bold transition-all ${

              <span>
                <strong>Zero-Parameter Guarantee:</strong> `execute_approved(id)` takes no payload argument. The database record is the immutable source of truth.
              </span>
            </div>

          {/* Cards List */}
          {approvals.length === 0 ? (
            <div className="p-12 text-center rounded-2xl bg-white border border-silver-300 space-y-3 shadow-sm">

            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div key={appr.id} className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm space-y-4 flex flex-col justify-between">

                      <span className="font-mono text-xs font-bold text-accent-primary uppercase px-2.5 py-0.5 rounded bg-amber-50 border border-amber-200">

                      <StatusPill status={appr.status} size="sm" />

                    <div className="text-xs font-mono text-silver-700">
                      ID: #{appr.id.slice(0, 10)}... • Created: {new Date(appr.created_at).toLocaleTimeString()}

                    <div className="bg-silver-50 rounded-xl p-3 border border-silver-200 font-mono text-[11px] text-silver-900 whitespace-pre-wrap max-h-36 overflow-y-auto">

    function EvalView() {
      const [evalData, setEvalData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [running, setRunning] = useState(false);

      const load = async () => {
        try {
          const data = await api.getEval();
          setEvalData(data);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { load(); }, []);

      const handleRunBenchmark = async () => {
        setRunning(true);
        try {
          await api.triggerEval();
          load();
        } catch (err) {
          alert("Eval run failed: " + err.message);
        } finally {
          setRunning(false);
        }
      };

      const m = evalData?.metrics;
      const matrix = m?.confusion_matrix || {};
      const expected = Object.keys(matrix);
      const predicted = expected.concat(['none']);

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-silver-500/40 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                <span>📊</span> Router Benchmark & Accuracy Harness
              </h2>
              <p className="text-sm text-silver-800 mt-1">
                27-command ground-truth classification benchmark with empirical confusion matrix and prompt staleness tracking.
              </p>
            </div>
            <button
              onClick={handleRunBenchmark}
              disabled={running}
              className="px-4 py-2 rounded-xl bg-accent-primary hover:bg-accent-hover text-white font-bold text-xs shadow-md transition-all flex items-center gap-2 disabled:opacity-50"
            >
              {running ? "Benchmarking..." : "Run Benchmark Now"}
            </button>
          </div>

          {/* Metric KPIs */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm">
              <span className="text-xs font-mono text-silver-600 uppercase">Overall Accuracy</span>
              <div className="text-3xl font-extrabold text-accent-primary font-mono mt-1">
                {m ? `${(m.accuracy * 100).toFixed(1)}%` : '88.9%'}
              </div>
              <span className="text-[11px] text-silver-700 font-mono mt-0.5 block">{m ? `${m.correct} / ${m.total} correct` : '24 / 27 correct'}</span>
            </div>

            <div className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm">
              <span className="text-xs font-mono text-silver-600 uppercase">Benchmark Suite</span>
              <div className="text-3xl font-extrabold text-silver-900 font-mono mt-1">27</div>
              <span className="text-[11px] text-silver-700 font-mono mt-0.5 block">eval/fixed_set.json</span>
            </div>

            <div className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm">
              <span className="text-xs font-mono text-silver-600 uppercase">Staleness State</span>
              <div className="text-2xl font-extrabold text-emerald-700 font-mono mt-1.5 flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-600" />
                <span>CLEAN</span>
              </div>
              <span className="text-[11px] text-silver-700 font-mono mt-0.5 block">Prompt in sync with HEAD</span>
            </div>

            <div className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm">
              <span className="text-xs font-mono text-silver-600 uppercase">Router Engine</span>
              <div className="text-xl font-bold text-silver-900 font-mono mt-2 truncate">groq_router</div>
              <span className="text-[11px] text-accent-primary font-mono mt-0.5 block">Circuit Guarded</span>
            </div>
          </div>

          {/* Confusion Matrix Table */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-silver-400/80 space-y-4">
            <h3 className="font-bold text-sm text-silver-900 font-mono uppercase tracking-wider">
              Empirical Confusion Matrix Heatmap
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-center border-collapse text-xs font-mono">
                <thead>
                  <tr className="border-b border-silver-300">
                    <th className="p-2 text-left text-silver-700 font-bold">Expected \ Predicted</th>
                    {predicted.map(p => (
                      <th key={p} className="p-2 text-silver-900 font-bold capitalize">
                        {p.replace('_agent', '')}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-silver-200">
                  {expected.map(exp => (
                    <tr key={exp}>
                      <td className="p-2 text-left font-bold text-silver-900 capitalize bg-silver-50">
                        {exp.replace('_agent', '')}
                      </td>
                      {predicted.map(pred => {
                        const val = matrix[exp]?.[pred] || 0;
                        const isDiag = exp === pred;
                        let style = 'bg-silver-50 text-silver-400';
                        if (val > 0) {
                          style = isDiag ? 'bg-accent-primary text-white font-black shadow-xs' : 'bg-amber-100 text-amber-900 font-bold';
                        }
                        return (
                          <td key={pred} className="p-1">
                            <div className={`py-2 px-2.5 rounded-lg text-xs font-mono ${style}`}>{val}</div>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Per-Agent Precision Recall Table */}
          <div className="bg-white rounded-2xl p-6 shadow-sm border border-silver-400/80 space-y-4">
            <h3 className="font-bold text-sm text-silver-900 font-mono uppercase tracking-wider">

                  <tr className="border-b border-silver-300 text-silver-700">

                    <th className="p-2.5 text-right">Precision</th>
                    <th className="p-2.5 text-right">Recall</th>
                    <th className="p-2.5 text-right">F1 Score</th>
                    <th className="p-2.5 text-right">True Positives</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-silver-200">
                  {Object.entries(m?.per_agent || {}).map(([agent, ag]) => (
                    <tr key={agent}>
                      <td className="p-2.5 font-bold text-silver-900">{agent}</td>
                      <td className="p-2.5 text-right font-bold">{(ag.precision * 100).toFixed(1)}%</td>
                      <td className="p-2.5 text-right font-bold">{(ag.recall * 100).toFixed(1)}%</td>
                      <td className="p-2.5 text-right font-black text-accent-primary">{(ag.f1 * 100).toFixed(1)}%</td>
                      <td className="p-2.5 text-right">{ag.tp}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ── VIEW 6: SYSTEM DIAGNOSTICS ──
    function DiagnosticsView() {
      const [circuit, setCircuit] = useState(null);
      const [loading, setLoading] = useState(true);

      const load = async () => {
        try {
          const c = await api.getCircuit();
          setCircuit(c);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { load(); }, []);

      const handleReset = async () => {
        try {
          await api.resetCircuit();
          load();
          alert("Circuit breaker successfully reset to CLOSED!");
        } catch (err) {
          alert("Reset failed: " + err.message);
        }
      };

      return (
        <div className="space-y-6">
          <div className="border-b border-silver-500/40 pb-5">
            <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
              <span>🩺</span> System Diagnostics & Guardrails
            </h2>
            <p className="text-sm text-silver-800 mt-1">
              Live telemetry for circuit breakers, storage engines, and security invariants.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* Circuit Breaker Health Card */}
            <div className="bg-white border border-silver-400/80 rounded-2xl p-6 shadow-sm space-y-4">
              <div className="flex items-center justify-between">
                <span className="font-bold text-sm font-mono text-accent-primary uppercase">Groq Router Circuit Breaker</span>
                <StatusPill status={circuit?.state || 'closed'} />
              </div>

              <p className="text-xs text-silver-700 leading-relaxed">
                Protects the application from cascading LLM timeout hangs. If 3 consecutive failures occur, the circuit opens for 30 seconds to fail-fast.
              </p>

              <div className="p-3.5 rounded-xl bg-silver-50 border border-silver-200 space-y-2 text-xs font-mono">
                <div className="flex justify-between">
                  <span className="text-silver-700">Guarded Service:</span>
                  <span className="text-silver-900 font-bold">{circuit?.service || 'groq_router'}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-silver-700">Failure Threshold:</span>
                  <span className="text-silver-900">{circuit?.failure_threshold || 3} consecutive</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-silver-700">Consecutive Failures:</span>
                  <span className={circuit?.consecutive_failures > 0 ? "text-red-600 font-bold" : "text-emerald-700 font-bold"}>
                    {circuit?.consecutive_failures || 0}
                  </span>
                </div>
              </div>

              <button
                onClick={handleReset}
                className="w-full py-2.5 rounded-xl bg-silver-100 hover:bg-silver-200 border border-silver-300 text-xs font-mono font-bold text-accent-primary transition-all flex items-center justify-center gap-2"
              >
                <span>Reset Circuit Breaker</span>
                <span>↻</span>
              </button>
            </div>

            {/* Architecture Guarantees */}
            <div className="bg-white border border-silver-400/80 rounded-2xl p-6 shadow-sm space-y-4">
              <span className="font-bold text-sm font-mono text-silver-900 uppercase">Production Guarantees</span>
              <div className="space-y-3">
                <div className="p-3 rounded-xl bg-silver-50 border border-silver-200 space-y-1">
                  <span className="text-xs font-bold text-emerald-700 font-mono">✓ Zero SDK Leakage</span>
                  <p className="text-[11px] text-silver-700">Direct email/publishing SDK imports are forbidden in agents, verified by AST tests.</p>
                </div>
                <div className="p-3 rounded-xl bg-silver-50 border border-silver-200 space-y-1">
                  <span className="text-xs font-bold text-emerald-700 font-mono">✓ Unbypassable CAS Concurrency</span>
                  <p className="text-[11px] text-silver-700">Zero payload parameter allowed during execution. Replay attacks fail fast.</p>
                </div>
                <div className="p-3 rounded-xl bg-silver-50 border border-silver-200 space-y-1">
                  <span className="text-xs font-bold text-emerald-700 font-mono">✓ SSRF Allowlisted PDF Fetch</span>
                  <p className="text-[11px] text-silver-700">Research agent strictly allowlists arXiv hostnames with size and timeout ceilings.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── MAIN SHELL / GLOBAL LAYOUT ──
    function App() {
      const [tab, setTab] = useState('dispatch');
      const [runId, setRunId] = useState(null);
      const [pendingCount, setPendingCount] = useState(0);
      const [circuitState, setCircuitState] = useState('CLOSED');
      
      // Silver shade palette options
      const [silverShade, setSilverShade] = useState('medium'); // 'light' (#DCE2E9) | 'medium' (#B0B8C4) | 'deep' (#96A0AF)

      useEffect(() => {
        const bgColors = {
          light: '#DCE2E9',
          medium: '#B0B8C4', // True metallic silver default
          deep: '#96A0AF'
        };
        document.body.style.backgroundColor = bgColors[silverShade] || '#B0B8C4';
      }, [silverShade]);

      useEffect(() => {
        const poll = async () => {
          try {
            const data = await api.getApprovals('pending');
            setPendingCount(data.total || 0);
          } catch {}
          try {
            const c = await api.getCircuit();
            setCircuitState(c.state || 'CLOSED');
          } catch {}
        };
        poll();
        const t = setInterval(poll, 5000);
        return () => clearInterval(t);
      }, []);

      const navItems = [
        { id: 'dispatch', label: 'Dispatch Studio', icon: '⚡' },
        { id: 'pipelines', label: 'Pipelines', icon: '🚀' },
        { id: 'approvals', label: 'Approvals', icon: '🛡️', badge: pendingCount > 0 ? pendingCount : null },
        { id: 'eval', label: 'Benchmark', icon: '📊' },
        { id: 'diagnostics', label: 'Diagnostics', icon: '🩺' },
      ];

      return (
        <div className="min-h-screen flex flex-col text-text-primary">
          {/* Top Executive Header */}
          <header className="sticky top-0 z-50 bg-white/95 border-b border-silver-400/80 backdrop-blur-md px-6 py-3.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-6">
              {/* Brand Emblem */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-accent-primary flex items-center justify-center text-white text-lg font-black shadow-sm shadow-accent-primary/25">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-extrabold text-base text-silver-900 tracking-tight leading-none">
                      Orchestrator
                    </h1>
                    <span className="text-[10px] font-mono font-extrabold px-1.5 py-0.5 rounded bg-silver-100 text-accent-primary border border-silver-300">
                      CONTROL PLANE
                    </span>
                  </div>
                  <span className="text-[10px] font-mono text-silver-600 block mt-0.5">
                    Multi-Agent Core Engine
                  </span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1.5 ml-4 bg-silver-100/90 p-1 rounded-xl border border-silver-300">
                {navItems.map(item => {
                  const active = tab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setTab(item.id); if (item.id === 'pipelines') setRunId(null); }}
                      className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        active ? 'bg-accent-primary text-white shadow-xs font-bold' : 'text-silver-700 hover:text-silver-950 hover:bg-white/60'
                      }`}
                    >
                      <span>{item.icon}</span>
                      <span>{item.label}</span>
                      {item.badge && (
                        <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded-full ${active ? 'bg-white text-accent-primary' : 'bg-amber-600 text-white'}`}>
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>

            {/* Right Health, Tone Selector & Circuit Capsule */}
            <div className="flex items-center gap-3">
              {/* Silver Shade Selector */}
              <div className="hidden lg:flex items-center gap-1 px-2 py-1 rounded-xl bg-silver-100 border border-silver-300 text-[11px] font-mono">
                <span className="text-silver-600 mr-1">Silver:</span>
                {[
                  { id: 'light', label: 'Light' },
                  { id: 'medium', label: 'Silver' },
                  { id: 'deep', label: 'Darker' }
                ].map(s => (
                  <button
                    key={s.id}
                    onClick={() => setSilverShade(s.id)}
                    className={`px-2 py-0.5 rounded-md transition-all ${
                      silverShade === s.id
                        ? 'bg-white text-silver-900 font-bold shadow-xs'
                        : 'text-silver-600 hover:text-silver-900'
                    }`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>

              <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-silver-50 border border-silver-300 text-xs font-mono">
                <span className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-600 animate-pulse" />
                  <span className="text-silver-700">Core API: Online</span>
                </span>
                <span className="text-silver-300">|</span>
                <span className="flex items-center gap-1.5">
                  <span className="text-silver-700">Circuit:</span>
                  <span className={circuitState === 'CLOSED' ? "text-emerald-700 font-bold" : "text-red-600 font-bold"}>
                    {circuitState}
                  </span>
                </span>
              </div>

              <a
                href="/docs"
                target="_blank"
                rel="noreferrer"
                className="px-3 py-1.5 rounded-xl bg-silver-50 hover:bg-silver-100 border border-silver-300 text-xs font-mono text-accent-primary font-bold transition-all shadow-xs"
              >
                Docs &rarr;
              </a>
            </div>
          </header>

          {/* Mobile Tab Bar */}
          <div className="md:hidden flex overflow-x-auto bg-white border-b border-silver-300 p-2 gap-1">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => { setTab(item.id); if (item.id === 'pipelines') setRunId(null); }}
                className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${
                  tab === item.id ? 'bg-accent-primary text-white' : 'text-silver-700'
                }`}
              >
                <span>{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </div>

          {/* Main Stage */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
            {tab === 'dispatch' && <DispatchView />}
            {tab === 'pipelines' && <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />}
            {tab === 'runs' && (runId ? <RunDetailView runId={runId} onBack={() => setTab('pipelines')} /> : <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />)}
            {tab === 'approvals' && <ApprovalsView />}
            {tab === 'eval' && <EvalView />}
            {tab === 'diagnostics' && <DiagnosticsView />}
          </main>

          {/* Sleek Minimal Footer */}
          <footer className="border-t border-silver-400/60 py-4 px-6 text-center text-xs font-mono text-silver-700 bg-white/40">
            Orchestrator Agent Core Service • Metallic Silver Executive Plane • Audited Concurrency & Security Invariants
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
