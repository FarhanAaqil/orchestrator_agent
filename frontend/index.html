  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ── Markdown Parser with Guaranteed Fallback ──
    function renderFormattedMarkdown(text) {
      if (!text) return '';
      try {
        if (window.marked && window.DOMPurify) {
          const raw = window.marked.parse(text, { breaks: true, gfm: true });
          return window.DOMPurify.sanitize(raw);
        }
      } catch (err) {
        console.warn('Marked parsing error, using fallback:', err);
      }

      // Built-in fallback renderer (eliminates ###, **, *, etc.)
      let h = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Code blocks
      h = h.replace(/```([a-zA-Z0-9_]*)\n([\s\S]*?)```/g, (m, lang, code) => (
        `<pre><code>${code.trim()}</code></pre>`
      ));
      // Inline code
      h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headings
      h = h.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
      h = h.replace(/^### (.*$)/gim, '<h3>$1</h3>');
      h = h.replace(/^## (.*$)/gim, '<h2>$1</h2>');
      h = h.replace(/^# (.*$)/gim, '<h1>$1</h1>');

      // Bold & Italic
      h = h.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*(.*?)\*/g, '<em>$1</em>');

      // Bullet lists
      h = h.replace(/^[\*\-] (.*$)/gim, '<li class="ml-4 list-disc">$1</li>');
      // Numbered lists
      h = h.replace(/^(\d+)\. (.*$)/gim, '<li class="ml-4 list-decimal">$2</li>');

      // Paragraph wrapping
      const chunks = h.split(/\n\n+/);
      return chunks.map(chunk => {
        const trimmed = chunk.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('<h') || trimmed.startsWith('<pre') || trimmed.startsWith('<li')) {
          return trimmed;
        }
        return `<p>${trimmed.replace(/\n/g, '<br />')}</p>`;
      }).join('');
    }

    // ── API Service ──
    const api = {
      dispatch: async (command, conversationId = null) => {
        const payload = { command, context: {} };
        if (conversationId) payload.conversation_id = conversationId;
        const res = await fetch('/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.status === 422) {
          const err = await res.json();
          throw { isClarification: true, ...err };
        }
        if (res.status === 503) {
          const err = await res.json();
          throw { isCircuitOpen: true, ...err };
        }
        if (!res.ok) {
          let errText = res.statusText;
          try { const j = await res.json(); errText = j.detail || errText; } catch {}
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        return res.json();
      },
      getAgents: async () => {
        const res = await fetch('/agents');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      getConversations: async () => {
        const res = await fetch('/conversations');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      createConversation: async (title) => {
        const res = await fetch('/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      getConversationMessages: async (id) => {
        const res = await fetch(`/conversations/${id}/messages`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      deleteConversation: async (id) => {
        const res = await fetch(`/conversations/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      startPipeline: async (name, command) => {
        const res = await fetch(`/pipeline/${name}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        return res.json();
      },
      getRun: async (runId) => {
        const res = await fetch(`/runs/${runId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      getApprovals: async (status) => {
        const q = status && status !== 'all' ? `?status=${encodeURIComponent(status)}` : '';
        const res = await fetch(`/approvals${q}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      approve: async (id) => {
        const res = await fetch(`/approvals/${id}/approve`, { method: 'POST' });
        return res.json();
      },
      reject: async (id) => {
        const res = await fetch(`/approvals/${id}/reject`, { method: 'POST' });
        return res.json();
      },
      execute: async (id) => {
        const res = await fetch(`/approvals/${id}/execute`, { method: 'POST' });
        return res.json();
      },
      getEval: async () => {
        const res = await fetch('/router/eval');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      triggerEval: async () => {
        const res = await fetch('/router/eval', { method: 'POST' });
        return res.json();
      },
      getCircuit: async () => {
        const res = await fetch('/system/circuit');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      resetCircuit: async () => {
        const res = await fetch('/system/circuit/reset', { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
    };

    // ── Accessible Status Pill ──
    function StatusPill({ status, size = 'md' }) {
      const s = (status || '').toLowerCase();
      let bg = 'bg-slate-100 text-slate-700 border border-slate-300';
      let dot = 'bg-slate-400';
      let label = s.toUpperCase();

      if (s === 'pending') {
        bg = 'bg-amber-50 text-amber-800 border border-amber-300 font-bold';
        dot = 'bg-amber-500 animate-pulse';
      } else if (s === 'approved' || s === 'completed' || s === 'executed' || s === 'closed' || s === 'ok') {
        bg = 'bg-emerald-50 text-emerald-800 border border-emerald-300 font-bold';
        dot = 'bg-emerald-600';
      } else if (s === 'rejected' || s === 'failed' || s === 'open') {
        bg = 'bg-red-50 text-red-800 border border-red-300 font-bold';
        dot = 'bg-red-500';
      }

      const sizeClasses = size === 'sm' ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs';

      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full font-mono ${sizeClasses} ${bg}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dot}`} />
          <span>{label}</span>
        </span>
      );
    }

    // ── VIEW 1: DISPATCH CHATBOT STUDIO (ChatGPT Style: Left Sidebar + Fixed-in-Place Chat Window) ──
    function DispatchView() {
      const [command, setCommand] = useState("");
      const [loading, setLoading] = useState(false);
      const [viewModes, setViewModes] = useState({}); // { [msgId]: 'formatted' | 'raw' }
      const [copiedId, setCopiedId] = useState(null);
      const [conversationId, setConversationId] = useState(null);
      const [conversations, setConversations] = useState([]);
      const [agentRoster, setAgentRoster] = useState([]);
      const messagesEndRef = useRef(null);

      const defaultWelcome = {
        id: "welcome-1",
        role: "assistant",
        agent: "general_chat_agent",
        text: "👋 **Greetings. I am Toji, your autonomous companion and executive operator.**\n\nAll 9 specialized agents in the cluster are fully armed and ready:\n* **🗡️ Toji Companion**: High-level strategy, system architecture, conversational sparring, and general execution.\n* **📧 Email Agent**: Inbox inspection via IMAP, correspondence summaries, recruiter outreach drafting, and gated email delivery.\n* **🐙 GitHub Agent**: Live repository inspection, commit history analysis, README generation, PR reviews, and gated issue creation.\n* **💼 LinkedIn Agent**: Recruiter discovery, 300-char connection requests, cold DMs, and gated post publishing.\n* **🎯 Career Agent**: Resume bullets tailoring, skill-gap analysis, cover letters, and interview coaching.\n* **🔬 Research Agent**: ArXiv preprint discovery, methodology synthesis, citation formatting, and peer critiques.\n* **✍️ Growth Agent**: High-impact technical articles for Dev.to / Hashnode, devlogs, and social threads.\n* **🔍 Critic Agent**: Rigorous adversarial evaluation, multi-criteria rubric scoring, and structural critiques.\n* **ℹ️ Info Agent**: Farhan Aaqil's background, featured projects portfolio, and architecture walkthroughs.\n\nType a command or choose a prompt below to begin.",
        time: "Just now"
      };

      const [messages, setMessages] = useState([defaultWelcome]);

      const loadAgents = async () => {
        try {
          const agents = await api.getAgents();
          if (Array.isArray(agents) && agents.length > 0) {
            setAgentRoster(agents);
          }
        } catch (err) {
          console.warn("Could not load agent roster:", err);
        }
      };

      const loadConversations = async () => {
        try {
          const convs = await api.getConversations();
          if (Array.isArray(convs)) {
            setConversations(convs);
          }
        } catch (err) {
          console.warn("Could not load conversations:", err);
        }
      };

      useEffect(() => {
        loadAgents();
        loadConversations();
      }, []);

      const selectConversation = async (cid) => {
        if (loading) return;
        setConversationId(cid);
        setLoading(true);
        try {
          const msgs = await api.getConversationMessages(cid);
          if (Array.isArray(msgs) && msgs.length > 0) {
            setMessages(msgs.map(m => ({
              id: m.id,
              role: m.role,
              agent: m.agent || "user",
              text: m.content,
              time: m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Saved'
            })));
          } else {
            setMessages([defaultWelcome]);
          }
        } catch (err) {
          console.error("Failed to load conversation messages:", err);
        } finally {
          setLoading(false);
        }
      };

      const startNewChat = () => {
        setConversationId(null);
        setMessages([defaultWelcome]);
      };

      const handleDeleteConversation = async (cid, e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        if (!cid) return;
        if (!confirm("Are you sure you want to delete this conversation thread?")) return;
        try {
          await api.deleteConversation(cid);
          setConversations(prev => prev.filter(c => c.id !== cid));
          if (conversationId === cid) {
            startNewChat();
          }
        } catch (err) {
          alert("Could not delete conversation: " + err.message);
        }
      };

      const presets = [
        { label: "🗡️ Talk with Toji", cmd: "Hi Toji, analyze our multi-agent architecture and tell me what needs optimization." },
        { label: "📧 Check Email Inbox", cmd: "Check my email inbox and summarize recent correspondence." },
        { label: "🐙 Inspect GitHub Repos", cmd: "List repos for my profile and give a portfolio health status." },
        { label: "💼 LinkedIn Connection Note", cmd: "Draft a concise 300-character LinkedIn connection note for a Senior ML Engineer." },
        { label: "🎯 Tailor Resume for ML", cmd: "Tailor my resume bullets for a Senior Machine Learning Engineer position at Anthropic." },
        { label: "🔬 ArXiv Research Synthesis", cmd: "Search arXiv for recent papers on LLM hallucination mitigation and summarize methodology." },
        { label: "✍️ Write Technical Devlog", cmd: "Draft a technical deep-dive on zero-parameter approval gates with SQLite CAS concurrency." },
        { label: "ℹ️ Farhan Aaqil's Portfolio", cmd: "Tell me about Farhan Aaqil's featured projects, research papers, and technical background." },
        { label: "⚠️ Trigger Clarification", cmd: "What should I do next?" }
      ];

      // Auto-scroll chat to bottom
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      const handleExecute = async (cmdOverride) => {
        const cmdToRun = (cmdOverride || command).trim();
        if (!cmdToRun || loading) return;

        setCommand("");
        setLoading(true);

        const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const userMsgId = Date.now();

        // Append User message to stream
        setMessages(prev => [
          ...prev,
          { id: userMsgId, role: "user", text: cmdToRun, time: nowTime }
        ]);

        try {
          const data = await api.dispatch(cmdToRun, conversationId);
          const assistantMsgId = Date.now() + 1;

          setMessages(prev => [
            ...prev,
            {
              id: assistantMsgId,
              role: "assistant",
              agent: data.agent,
              text: data.output,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            }
          ]);

          if (data.metadata && data.metadata.conversation_id) {
            setConversationId(data.metadata.conversation_id);
          }
          loadConversations();
        } catch (err) {
          if (err.isClarification) {
            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                role: "clarification",
                reasoning: err.reasoning || err.detail,
                candidates: err.candidates || [],
                originalCommand: cmdToRun,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              }
            ]);
          } else if (err.isCircuitOpen) {
            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                role: "error",
                text: `Circuit Breaker OPEN: External service is temporarily cooling down. ${err.detail || ''}`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              }
            ]);
          } else {
            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                role: "error",
                text: err.message || "Execution failed.",
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              }
            ]);
          }
        } finally {
          setLoading(false);
        }
      };

      const copyMessage = (id, text) => {
        navigator.clipboard.writeText(text);
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 2000);
      };

      const toggleViewMode = (msgId) => {
        setViewModes(prev => ({
          ...prev,
          [msgId]: prev[msgId] === 'raw' ? 'formatted' : 'raw'
        }));
      };

      const getAgentBadge = (id) => {
        const iconMap = {
          general_chat_agent: "🗡️",
          email_agent: "📧",
          github_agent: "🐙",
          linkedin_agent: "💼",
          career_agent: "🎯",
          research_agent: "🔬",
          growth_content_agent: "✍️",
          critic_agent: "🔍",
          info_agent: "ℹ️"
        };
        return iconMap[id] || "⚡";
      };

      // Fallback agent roster if API is still loading
      const displayRoster = agentRoster.length > 0 ? agentRoster : [
        { id: "general_chat_agent", name: "Toji", description: "Farhan Aaqil's razor-sharp AI companion, executive operator, and systems architect.", gated_capabilities: [] },
        { id: "email_agent", name: "Email Agent", description: "Inbox reader, recruiter outreach drafter, and communication specialist.", gated_capabilities: ["Send email"] },
        { id: "github_agent", name: "GitHub Agent", description: "Repository inspector, commit assistant, and documentation manager.", gated_capabilities: ["Create issues"] },
        { id: "linkedin_agent", name: "LinkedIn Agent", description: "Professional networking, recruiter discovery, and 300-char connection notes.", gated_capabilities: ["Publish posts"] },
        { id: "career_agent", name: "Career Agent", description: "Resume tailoring, skill-gap analysis, cover letters.", gated_capabilities: [] },
        { id: "research_agent", name: "Research Agent", description: "ArXiv literature retrieval, synthesis, peer reviews.", gated_capabilities: [] },
        { id: "growth_content_agent", name: "Growth Agent", description: "Tech articles, Dev.to/Hashnode drafts, social threads.", gated_capabilities: ["Publish articles"] },
        { id: "critic_agent", name: "Critic Agent", description: "Objective scoring, rubric reviews, gap critiques.", gated_capabilities: [] },
        { id: "info_agent", name: "Info Agent", description: "Farhan Aaqil's projects portfolio, system architecture, and documentation.", gated_capabilities: [] },
      ];

      return (
        <div className="flex-1 min-h-0 flex flex-col h-full space-y-3">
          {/* Header Bar */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-silver-500/40 pb-2 flex-shrink-0">
            <div>
              <h2 className="text-lg font-extrabold text-silver-900 tracking-tight flex items-center gap-2">
                <span>🗡️</span> Toji & Agent Fleet
              </h2>
              <p className="text-xs text-silver-800">
                Autonomous multi-agent cluster with conversational memory and audited execution safety.
              </p>
            </div>

                  if (m.role === 'error') {
                    return (
                      <div key={m.id} className="flex flex-col items-start space-y-1 max-w-2xl">

                        </div>

                    );

                  // Default: Assistant Message
                  const isRaw = viewModes[m.id] === 'raw';
                  const displayAgentName = m.agent === 'general_chat_agent' ? 'Toji' : (m.agent || 'Assistant');

                  return (
                    <div key={m.id} className="flex flex-col items-start space-y-2 max-w-3xl">
                      {/* Assistant Header Capsule */}
                      <div className="flex flex-wrap items-center justify-between gap-3 w-full border-b border-silver-200 pb-1.5">

                          <span className="text-xs font-mono font-bold text-silver-600 uppercase">Agent:</span>
                          <span className="font-mono font-extrabold text-xs px-2 py-0.5 rounded bg-silver-900 text-white shadow-xs flex items-center gap-1.5">

                              onClick={() => toggleViewMode(m.id)}
                              className={`px-2 py-0.5 rounded-md font-medium transition-all ${
                                !isRaw ? 'bg-white text-silver-900 shadow-xs font-bold' : 'text-silver-600'
                              }`}
                            >
                              ✨ Formatted
                            </button>
                            <button
                              onClick={() => toggleViewMode(m.id)}
                              className={`px-2 py-0.5 rounded-md font-medium font-mono transition-all ${
                                isRaw ? 'bg-white text-silver-900 shadow-xs font-bold' : 'text-silver-600'
                              }`}
                            >
                              📄 Raw
                            </button>
                          </div>

                          {/* Copy Button */}
                          <button
                            onClick={() => copyMessage(m.id, m.text)}
                            className={`px-2.5 py-0.5 rounded-lg border text-[11px] font-medium transition-all flex items-center gap-1 ${
                              copiedId === m.id
                                ? 'bg-emerald-50 border-emerald-300 text-emerald-700 font-bold'
                                : 'bg-silver-50 hover:bg-silver-100 border-silver-300 text-silver-700'
                            }`}
                          >
                            <span>{copiedId === m.id ? '✓ Copied!' : '📋 Copy'}</span>
                          </button>
                        </div>
                      </div>

                      {/* Content Body */}
                      <div className="w-full bg-silver-50/70 border border-silver-200 rounded-2xl p-4 shadow-xs transition-all">
                        {isRaw ? (
                          <pre className="bg-slate-900 rounded-xl p-4 text-xs font-mono text-slate-100 whitespace-pre-wrap overflow-x-auto">
                            {m.text}
                          </pre>
                        ) : (
                          <div
                            className="prose-output"
                            dangerouslySetInnerHTML={{ __html: renderFormattedMarkdown(m.text) }}
                          />
                        )}
                      </div>
                    </div>
                  );
                })}

                {/* Loading Skeleton Loader */}
                {loading && (
                  <div className="flex flex-col items-start space-y-3 max-w-2xl w-full">
                    <div className="flex items-center gap-2">
                      <span className="w-4 h-4 rounded-full border-2 border-accent-primary border-t-transparent animate-spin" />
                      <span className="text-xs font-mono font-bold text-silver-700 animate-pulse">Toji is executing & orchestrating response...</span>
                    </div>
                    <div className="w-full bg-silver-50/80 border border-silver-200 rounded-2xl p-4 space-y-2.5 animate-pulse shadow-xs">
                      <div className="h-4 bg-silver-300 rounded-md w-3/4"></div>
                      <div className="h-3.5 bg-silver-200 rounded-md w-11/12"></div>
                      <div className="h-3.5 bg-silver-200 rounded-md w-4/5"></div>
                    </div>
                  </div>
                )}

                <div ref={messagesEndRef} />
              </div>

              {/* Bottom Fixed Input Dock */}
              <div className="border-t border-silver-300 bg-white p-3.5 space-y-2.5 flex-shrink-0">
                {/* Quick-Prompt Suggestions Carousel */}
                <div className="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
                  <span className="text-[11px] font-mono text-silver-500 flex-shrink-0">Prompts:</span>
                  {presets.slice(0, 5).map((p, i) => (
                    <button
                      key={i}
                      onClick={() => handleExecute(p.cmd)}
                      disabled={loading}
                      className="flex-shrink-0 px-2.5 py-1 rounded-full bg-silver-100 hover:bg-silver-200 border border-silver-300 text-silver-700 hover:text-silver-900 transition-all font-medium disabled:opacity-50 text-[11px]"
                    >
                      {p.label}
                    </button>
                  ))}
                </div>

                {/* ChatGPT-style Input Bar */}
                <div className="relative flex items-center bg-silver-50 border border-silver-300 rounded-2xl p-2 shadow-inner focus-within:border-accent-primary focus-within:bg-white focus-within:ring-1 focus-within:ring-accent-primary transition-all">
                  <textarea
                    value={command}
                    onChange={e => setCommand(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleExecute();
                      }
                    }}
                    placeholder="Message Toji or command an agent... (Press ↵ Enter to send, Shift+Enter for new line)"
                    rows={2}
                    className="flex-1 bg-transparent px-3 py-1 text-sm text-silver-900 placeholder:text-silver-500 focus:outline-none resize-none font-sans"
                  />

                  <div className="flex items-center gap-2 pr-2">
                    {command && (
                      <button
                        onClick={() => setCommand('')}
                        className="text-xs text-silver-500 hover:text-silver-800 px-2 py-1 rounded"
                      >
                        Clear
                      </button>
                    )}

                    <button
                      onClick={() => handleExecute()}
                      disabled={loading || !command.trim()}
                      className="w-9 h-9 rounded-xl bg-accent-primary hover:bg-accent-hover text-white flex items-center justify-center font-bold text-base shadow-md shadow-accent-primary/25 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                      title="Send Message"
                    >
                      {loading ? (
                        <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" />
                      ) : (
                        <span>↑</span>
                      )}
                    </button>
                  </div>
                </div>

                <div className="flex items-center justify-between text-[11px] font-mono text-silver-500 px-1">
                  <span>Chatbot Powered by Toji & Multi-Agent Router</span>
                  <span>Input auto-clears on send</span>
                </div>
              </div>
            </section>
          </div>
        </div>
      );
    }

    // ── VIEW 2: MULTI-STEP PIPELINES ──

      const [pipelineCmds, setPipelineCmds] = useState({
        apply: "Staff Machine Learning Engineer role at Anthropic",
        publish: "Architecting zero-parameter approval gates with SQLite CAS concurrency",
        research: "Multi-agent fault tolerance and deterministic state recovery"
      });

      const pipelines = [
        {
          id: 'apply',
          title: 'Candidate Application Workflow',
          desc: 'End-to-end job application: tailors resume bullets, drafts personalized cover letter, and requests safety review.',
          icon: '📄',
          badge: 'Career Engine',
          steps: ['Resume Tailoring', 'Cover Letter Draft', 'Quality Critique', 'Approval Queue']
        },
        {
          id: 'publish',
          title: 'Technical Publishing Workflow',
          desc: 'Drafts technical deep-dive, critiques for authenticity, and stages unbypassable approval gate for Dev.to / Hashnode.',
          icon: '📰',
          badge: 'Growth Engine',
          steps: ['Content Generation', 'Editorial Critique', 'Safety Gate Queue', 'External Dispatch']
        },
        {
          id: 'research',
          title: 'Academic Research Synthesis',
          desc: 'Queries arXiv literature, synthesizes methodology, generates structured IEEE critique, and drafts report.',
          icon: '🧪',
          badge: 'Research Engine',
          steps: ['Literature Discovery', 'Paper Synthesis', 'Peer Critique', 'Final Summary']
        }

          if (onSelectRun) onSelectRun(res.run_id);

          alert('Failed to start pipeline: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="border-b border-silver-500/40 pb-5">

              <span>🚀</span> Multi-Step Pipelines
            </h2>
            <p className="text-sm text-silver-800 mt-1">
              Deterministic, multi-agent automated workflows audited with step-by-step trace tracking.
            </p>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                key={p.id}

                  <div className="flex items-center justify-between">

                    <span className="text-[10px] font-mono font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-300">
                      {p.badge}

                  <div>

                    <p className="text-xs text-silver-700 mt-1 leading-relaxed">{p.desc}</p>
                  </div>

                  {/* Flow Diagram */}
                  <div className="space-y-1.5 pt-2">
                    <span className="text-[10px] font-mono text-silver-700 uppercase tracking-wider block">Execution Stages:</span>
                    <div className="flex flex-col gap-1.5">
                      {p.steps.map((st, idx) => (
                        <div key={idx} className="flex items-center gap-2 text-xs font-mono text-silver-900 bg-silver-50 px-2.5 py-1.5 rounded-lg border border-silver-200">
                          <span className="w-4 h-4 rounded-full bg-white border border-silver-300 flex items-center justify-center text-[10px] text-accent-primary font-bold shadow-xs">
                            {idx + 1}

                          <span>{st}</span>

                  <div className="space-y-1.5 pt-2">
                    <label className="text-[11px] font-mono text-silver-700 uppercase tracking-wider block">Pipeline Prompt:</label>

                    />

                <button
                  onClick={() => handleStart(p.id)}

                  className="w-full py-2.5 rounded-xl bg-accent-primary hover:bg-accent-hover text-white font-bold text-xs shadow-md shadow-accent-primary/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50"

                  <span>&rarr;</span>
                </button>
              </div>
            ))}
          </div>
        </div>
      );

    // ── VIEW 3: RUN DETAIL VIEW ──
    function RunDetailView({ runId, onBack }) {
      const [run, setRun] = useState(null);
      const [loading, setLoading] = useState(true);

      const fetchDetails = async () => {
        try {
          const data = await api.getRun(runId);
          setRun(data);
        } catch (err) {
          alert("Failed to load run: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDetails();
        const t = setInterval(fetchDetails, 3000);
        return () => clearInterval(t);
      }, [runId]);

      if (loading && !run) {
        return (
          <div className="p-12 text-center text-xs font-mono text-silver-700">
            Loading run details for #{runId}...
          </div>
        );
      }

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex items-center justify-between border-b border-silver-500/40 pb-5">
            <div className="flex items-center gap-4">
              <button
                onClick={onBack}
                className="px-3 py-1.5 rounded-xl bg-white hover:bg-silver-100 border border-silver-300 text-xs font-mono font-bold text-accent-primary transition-all shadow-xs"
              >
                &larr; Back to Pipelines
              </button>
              <div>
                <h2 className="text-xl font-extrabold text-silver-900 font-mono">
                  Run #{runId.slice(0, 8)}
                </h2>
                <span className="text-xs text-silver-700 font-mono">Pipeline: {run?.pipeline_name || 'Workflow'}</span>
              </div>
            </div>
            <StatusPill status={run?.status || 'running'} />
          </div>

          {/* Stepper Timeline */}
          <div className="space-y-4">
            <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-accent-primary">
              Step Audit Log ({run?.steps?.length || 0} stages)
            </h3>

            {(!run?.steps || run.steps.length === 0) ? (

    // ── VIEW 4: APPROVALS QUEUE ──
    function ApprovalsView() {
      const [filter, setFilter] = useState('pending');
      const [approvals, setApprovals] = useState([]);
      const [loading, setLoading] = useState(false);

      const load = async () => {
        setLoading(true);
        try {
          const data = await api.getApprovals(filter);
          setApprovals(data.items || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        load();
        const t = setInterval(load, 5000);
        return () => clearInterval(t);
      }, [filter]);

      const act = async (action, id) => {
        try {
          if (action === 'approve') await api.approve(id);
          if (action === 'reject') await api.reject(id);
          if (action === 'execute') await api.execute(id);
          load();
        } catch (err) {
          alert('Action failed: ' + err.message);
        }
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="border-b border-silver-500/40 pb-5 space-y-2">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 className="text-2xl font-extrabold text-silver-900 tracking-tight flex items-center gap-2.5">
                  <span>🛡️</span> Human-in-the-Loop Safety Gate
                </h2>
                <p className="text-sm text-silver-800 mt-1">
                  Sensitive actions queue requiring explicit human authorization. Callers cannot substitute payloads at execution time.
                </p>
              </div>

              {/* Status Filter Tabs */}
              <div className="flex bg-white p-1 rounded-xl border border-silver-300 shadow-xs">
                {['pending', 'approved', 'executed', 'rejected', 'all'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setFilter(tab)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono uppercase font-bold transition-all ${
                      filter === tab ? 'bg-accent-primary text-white shadow-xs' : 'text-silver-700 hover:text-silver-950'
                    }`}
                  >
                    {tab}
                  </button>
                ))}
              </div>
            </div>

            {/* Zero-Parameter Safety Notice */}
            <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 text-xs font-mono text-amber-900 flex items-center gap-2">
              <span>🔒</span>
              <span>
                <strong>Zero-Parameter Guarantee:</strong> `execute_approved(id)` takes no payload argument. The database record is the immutable source of truth.
              </span>
            </div>
          </div>

          {/* Cards List */}
          {approvals.length === 0 ? (
            <div className="p-12 text-center rounded-2xl bg-white border border-silver-300 space-y-3 shadow-sm">
              <span className="text-3xl">🛡️</span>
              <p className="text-sm font-mono text-silver-700">No approval records matching filter "{filter}".</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {approvals.map(appr => (
                <div key={appr.id} className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm space-y-4 flex flex-col justify-between">
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-xs font-bold text-accent-primary uppercase px-2.5 py-0.5 rounded bg-amber-50 border border-amber-200">
                        {appr.action_type}
                      </span>
                      <StatusPill status={appr.status} size="sm" />
                    </div>

                    <div className="text-xs font-mono text-silver-700">
                      ID: #{appr.id.slice(0, 10)}... • Created: {new Date(appr.created_at).toLocaleTimeString()}
                    </div>

                    {/* Formatted Canonical Payload Box */}
                    <div className="bg-silver-50 rounded-xl p-3 border border-silver-200 font-mono text-[11px] text-silver-900 whitespace-pre-wrap max-h-36 overflow-y-auto">
                      {JSON.stringify(appr.payload, null, 2)}
                    </div>
                  </div>

                  {/* Actions */}
                  <div className="pt-2 border-t border-silver-200 flex items-center justify-end gap-2">
                    {appr.status === 'pending' && (
                      <>

                        >
                          Reject
                        </button>
                        <button
                          onClick={() => act('approve', appr.id)}
                          className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-mono font-bold shadow-xs transition-all"
                        >
                          Approve
                        </button>
                      </>
                    )}
                    {appr.status === 'approved' && (
                      <button
                        onClick={() => act('execute', appr.id)}
                        className="px-4 py-2 rounded-lg bg-accent-primary hover:bg-accent-hover text-white text-xs font-mono font-bold shadow-md flex items-center gap-1.5 transition-all"

            <div className="bg-white border border-silver-400/80 rounded-2xl p-5 shadow-sm">

                        let style = 'bg-silver-50 text-silver-400';
                        if (val > 0) {
                          style = isDiag ? 'bg-accent-primary text-white font-black shadow-xs' : 'bg-amber-100 text-amber-900 font-bold';

                        return (
                          <td key={pred} className="p-1">

                      <td className="p-2.5 text-right font-black text-accent-primary">{(ag.f1 * 100).toFixed(1)}%</td>
                      <td className="p-2.5 text-right">{ag.tp}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

                <span className="flex items-center gap-1.5">
                  <span className="text-silver-700">Circuit:</span>
                  <span className={circuitState === 'CLOSED' ? "text-emerald-700 font-bold" : "text-red-600 font-bold"}>
                    {circuitState}
                  </span>
                </span>
              </div>

              <a
                href="/docs"
                target="_blank"
                rel="noreferrer"
                className="px-3 py-1.5 rounded-xl bg-silver-50 hover:bg-silver-100 border border-silver-300 text-xs font-mono text-accent-primary font-bold transition-all shadow-xs"
              >
                Docs &rarr;
              </a>
            </div>
          </header>

          {/* Mobile Tab Bar */}
          <div className="md:hidden flex overflow-x-auto bg-white border-b border-silver-300 p-2 gap-1 flex-shrink-0">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => { setTab(item.id); if (item.id === 'pipelines') setRunId(null); }}
                className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${
                  tab === item.id ? 'bg-accent-primary text-white' : 'text-silver-700'
                }`}
              >
                <span>{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </div>

          {/* Main Stage */}
          <main className={`w-full mx-auto ${tab === 'dispatch' ? 'flex-1 min-h-0 max-w-7xl px-4 md:px-6 py-2.5 flex flex-col overflow-hidden' : 'flex-1 max-w-7xl p-6 md:p-8'}`}>
            {tab === 'dispatch' && <DispatchView />}
            {tab === 'pipelines' && <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />}
            {tab === 'runs' && (runId ? <RunDetailView runId={runId} onBack={() => setTab('pipelines')} /> : <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />)}
            {tab === 'approvals' && <ApprovalsView />}
            {tab === 'eval' && <EvalView />}
            {tab === 'diagnostics' && <DiagnosticsView />}
          </main>

          {/* Sleek Minimal Footer */}
          <footer className={`border-t border-silver-400/60 text-center font-mono text-silver-700 bg-white/40 flex-shrink-0 ${tab === 'dispatch' ? 'py-1.5 px-4 text-[11px]' : 'py-4 px-6 text-xs'}`}>
            Orchestrator Agent Core Service • Metallic Silver Executive Plane • Audited Concurrency & Security Invariants
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
