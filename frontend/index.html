<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orchestrator Agent v2 — Executive Control Plane</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS with MP072 Design Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: { dark: '#1B2632', light: '#EEE9DF' },
            surface: { primary: '#2C3B4D', muted: '#C9C1B1' },
            accent: { primary: '#FFB162' },
            state: { warning: '#A35139', success: '#5A8A6B', danger: '#B4453A' },
            text: { primary: '#EEE9DF', onLight: '#1B2632', muted: '#7C8A99' },
          },
          borderRadius: { pill: '999px' },
        },
      },
    };
  </script>

  <style>
    body {
      background-color: #1B2632;
      color: #EEE9DF;
      font-family: 'Inter', system-ui, sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1B2632; }
    ::-webkit-scrollbar-thumb { background: #2C3B4D; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #FFB162; }
  </style>

  <!-- React 18 and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-canvas-dark text-text-primary min-h-screen flex flex-col antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── API Service ──
    const api = {
      dispatch: async (command) => {
        const res = await fetch('/dispatch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command, context: {} })
        });
        if (res.status === 422) {
          const err = await res.json();
          throw { isClarification: true, ...err };
        }
        if (res.status === 503) {
          const err = await res.json();
          throw { isCircuitOpen: true, ...err };
        }
        if (!res.ok) {
          let errText = res.statusText;
          try { const j = await res.json(); errText = j.detail || errText; } catch {}
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }
        return res.json();
      },
      startPipeline: async (name, command) => {
        const res = await fetch(`/pipeline/${name}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        return res.json();
      },
      getRun: async (runId) => {
        const res = await fetch(`/runs/${runId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      getApprovals: async (status) => {
        const q = status && status !== 'all' ? `?status=${encodeURIComponent(status)}` : '';
        const res = await fetch(`/approvals${q}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      approve: async (id) => {
        const res = await fetch(`/approvals/${id}/approve`, { method: 'POST' });
        return res.json();
      },
      reject: async (id) => {
        const res = await fetch(`/approvals/${id}/reject`, { method: 'POST' });
        return res.json();
      },
      execute: async (id) => {
        const res = await fetch(`/approvals/${id}/execute`, { method: 'POST' });
        return res.json();
      },
      getEval: async () => {
        const res = await fetch('/router/eval');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      triggerEval: async () => {
        const res = await fetch('/router/eval', { method: 'POST' });
        return res.json();
      },
      getCircuit: async () => {
        const res = await fetch('/system/circuit');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
      resetCircuit: async () => {
        const res = await fetch('/system/circuit/reset', { method: 'POST' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      },
    };

    // ── Accessible Status Pill ──
    function StatusPill({ status, size = 'md' }) {
      const s = (status || '').toLowerCase();
      let bg = 'bg-surface-primary text-text-primary border border-surface-muted/30';
      let dot = 'bg-surface-muted';
      let label = s.toUpperCase();

      if (s === 'pending') {
        bg = 'bg-state-warning/20 text-[#FFB162] border border-state-warning/50 font-bold';
        dot = 'bg-[#FFB162] animate-pulse';
      } else if (s === 'approved' || s === 'completed' || s === 'executed' || s === 'closed' || s === 'ok') {
        bg = 'bg-state-success/20 text-[#5A8A6B] border border-state-success/40 font-bold';
        dot = 'bg-[#5A8A6B]';
      } else if (s === 'rejected' || s === 'failed' || s === 'open') {
        bg = 'bg-state-danger/20 text-[#B4453A] border border-state-danger/40 font-bold';
        dot = 'bg-[#B4453A]';
      } else if (s === 'running' || s === 'executing') {
        bg = 'bg-accent-primary text-text-onLight font-bold animate-pulse';
        dot = 'bg-[#1B2632]';
      }

      const pad = size === 'sm' ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs';
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-pill uppercase tracking-wider font-mono ${pad} ${bg}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dot}`} />
          <span>{label}</span>
        </span>
      );
    }

    // ── VIEW 1: DISPATCH STUDIO ──
    function DispatchView() {
      const [command, setCommand] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [clarification, setClarification] = useState(null);
      const [history, setHistory] = useState([
        { cmd: "Tailor my resume for Machine Learning Engineer", agent: "career_agent", time: "Just now" },
        { cmd: "Search arXiv papers on multi-agent consensus", agent: "research_agent", time: "5m ago" },
      ]);

      const presets = [
        { label: "💼 Tailor Resume for ML Role", cmd: "Tailor my resume for a Senior Machine Learning Engineer role" },
        { label: "🔬 Search arXiv Consensus Papers", cmd: "Find recent arXiv papers on multi-agent consensus and reasoning" },
        { label: "✍️ Draft Dev.to Technical Blog", cmd: "Write a Dev.to post about unbypassable human approval gates" },
        { label: "🔍 Score & Critique Cover Letter", cmd: "Critique my cover letter for technical depth and clarity" },
        { label: "❓ Ambiguous Query (Demo 422)", cmd: "What should I do next with my project?" },
      ];

      const handleExecute = async (inputCmd) => {
        const cmdToRun = inputCmd || command;
        if (!cmdToRun.trim()) return;

        setLoading(true);
        setError(null);
        setClarification(null);

        try {
          const data = await api.dispatch(cmdToRun);
          setResult(data);
          setHistory(prev => [{ cmd: cmdToRun, agent: data.agent, time: "Just now" }, ...prev.slice(0, 5)]);
        } catch (err) {
          if (err.isClarification) {
            setClarification(err.detail || err);
          } else if (err.isCircuitOpen) {
            setError(`Circuit Breaker OPEN: Groq service is temporarily unavailable or cooled down. ${err.detail || ''}`);
          } else {
            setError(err.message || "Execution failed.");
          }
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-surface-muted/20 pb-5">
            <div>
              <h2 className="text-2xl font-extrabold text-[#EEE9DF] tracking-tight flex items-center gap-2.5">
                <span>⚡</span> Dispatch & Agent Studio
              </h2>
              <p className="text-sm text-text-muted mt-1">
                Natural-language command classifier and execution dispatch with zero-leakage safety barriers.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono text-text-muted">Threshold:</span>
              <span className="px-2.5 py-1 rounded-md bg-surface-primary border border-surface-muted/30 text-accent-primary font-mono text-xs font-bold">
                ≥ 0.60
              </span>
            </div>
          </div>

          {/* Main 2-Column Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Console (7 Cols) */}
            <div className="lg:col-span-8 space-y-5">
              {/* Command Input Box */}
              <div className="bg-surface-primary/90 border border-surface-muted/30 rounded-2xl p-5 shadow-xl backdrop-blur-sm space-y-4">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase tracking-wider text-accent-primary font-mono flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-accent-primary animate-ping" />
                    Prompt Input Console
                  </span>
                  <span className="text-[11px] text-text-muted font-mono">Press ↵ Enter to Dispatch</span>
                </div>

                <div className="relative">
                  <textarea
                    value={command}
                    onChange={e => setCommand(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleExecute();
                      }
                    }}
                    placeholder="Enter natural language command (e.g., 'Tailor my resume for Senior AI Engineer')..."
                    rows={3}
                    className="w-full bg-canvas-dark/90 border border-surface-muted/30 rounded-xl p-4 text-sm font-mono text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all resize-none shadow-inner"
                  />
                  <div className="absolute right-3 bottom-3.5 flex items-center gap-2">
                    {command && (
                      <button
                        onClick={() => setCommand('')}
                        className="text-xs text-text-muted hover:text-text-primary px-2 py-1 rounded"
                      >
                        Clear
                      </button>
                    )}
                    <button
                      onClick={() => handleExecute()}
                      disabled={loading || !command.trim()}
                      className="px-4 py-2 rounded-lg bg-accent-primary hover:bg-[#ffa347] text-text-onLight font-bold text-xs shadow-lg shadow-accent-primary/20 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      {loading ? (
                        <>
                          <span className="w-3.5 h-3.5 border-2 border-text-onLight border-t-transparent rounded-full animate-spin" />
                          <span>Routing...</span>
                        </>
                      ) : (
                        <>
                          <span>Dispatch</span>
                          <span>&rarr;</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>

                {/* Preset Prompts Chips */}
                <div className="space-y-2 pt-1 border-t border-surface-muted/15">
                  <span className="text-[11px] font-mono text-text-muted uppercase tracking-wider block">Quick-Start Commands:</span>
                  <div className="flex flex-wrap gap-2">
                    {presets.map((p, i) => (
                      <button
                        key={i}
                        onClick={() => {
                          setCommand(p.cmd);
                          handleExecute(p.cmd);
                        }}
                        className="px-2.5 py-1.5 rounded-lg bg-canvas-dark/60 hover:bg-canvas-dark border border-surface-muted/20 hover:border-accent-primary/60 text-xs text-text-muted hover:text-text-primary transition-all text-left"
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Error Alert */}
              {error && (
                <div className="bg-state-danger/15 border border-state-danger/40 rounded-xl p-4 text-xs font-mono text-[#EEE9DF] flex items-start gap-3 shadow-lg animate-fade-in">
                  <span className="text-base text-state-danger">⚠️</span>
                  <div className="flex-1 space-y-1">
                    <span className="font-bold text-state-danger uppercase tracking-wider block">Execution Notice</span>
                    <p className="text-text-primary/90">{error}</p>
                  </div>
                  <button onClick={() => setError(null)} className="text-text-muted hover:text-text-primary">✕</button>
                </div>
              )}

              {/* Clarification Prompt Card (422) */}
              {clarification && (
                <div className="bg-state-warning/15 border border-state-warning/50 rounded-2xl p-5 shadow-2xl space-y-4">
                  <div className="flex items-center gap-2.5 text-accent-primary font-bold text-sm">
                    <span>⚠️</span>
                    <span>Clarification Needed (Confidence Below 60%)</span>
                  </div>
                  <p className="text-xs text-text-primary/90 font-mono">
                    {clarification.reasoning || "The router could not definitively classify your intent. Please select the intended target agent:"}
                  </p>
                  <div className="flex flex-wrap gap-2.5 pt-2">
                    {(clarification.candidates || []).map(agent => (
                      <button
                        key={agent}
                        onClick={() => handleExecute(`[For ${agent}] ${command}`)}
                        className="px-3.5 py-2 rounded-xl bg-surface-primary hover:bg-accent-primary hover:text-text-onLight border border-surface-muted/30 text-xs font-mono font-bold text-accent-primary transition-all flex items-center gap-2"
                      >
                        <span>🎯 Re-route to:</span>
                        <span className="underline">{agent}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Execution Result View */}
              {result && (
                <div className="bg-canvas-light text-text-onLight rounded-2xl p-6 shadow-2xl space-y-5 border border-surface-muted/30 transition-all">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-surface-muted/30 pb-4">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-surface-primary flex items-center justify-center text-accent-primary font-bold text-base shadow">
                        ✓
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-mono font-bold uppercase tracking-wider text-surface-primary/70">Target Agent:</span>
                          <span className="font-mono font-extrabold text-sm px-2 py-0.5 rounded bg-surface-primary text-[#EEE9DF]">
                            {result.agent}
                          </span>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(result.output || '');
                          alert('Output copied to clipboard!');
                        }}
                        className="px-3 py-1.5 rounded-lg bg-surface-primary/10 hover:bg-surface-primary/20 text-surface-primary text-xs font-mono font-bold transition-all"
                      >
                        Copy Output
                      </button>
                    </div>
                  </div>

                  {/* Formatted Output Body */}
                  <div className="bg-white/80 rounded-xl p-5 border border-surface-muted/20 text-xs sm:text-sm font-mono text-surface-primary leading-relaxed whitespace-pre-wrap max-h-[500px] overflow-y-auto shadow-inner">
                    {result.output}
                  </div>
                </div>
              )}
            </div>

            {/* Right Inspector Rail (4 Cols) */}
            <div className="lg:col-span-4 space-y-5">
              {/* Agent Roster Card */}
              <div className="bg-surface-primary/70 border border-surface-muted/25 rounded-2xl p-5 shadow-lg space-y-3.5">
                <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-accent-primary flex items-center justify-between">
                  <span>Supported Agent Roster</span>
                  <span className="w-2 h-2 rounded-full bg-state-success" />
                </h3>
                <div className="space-y-2.5">
                  {[
                    { id: "career_agent", name: "Career Agent", desc: "Resume tailoring, skill-gap analysis, cover letters.", icon: "💼" },
                    { id: "research_agent", name: "Research Agent", desc: "ArXiv literature retrieval, synthesis, peer reviews.", icon: "🔬" },
                    { id: "growth_content_agent", name: "Growth Agent", desc: "Tech articles, Dev.to/Hashnode drafts, social threads.", icon: "✍️" },
                    { id: "critic_agent", name: "Critic Agent", desc: "Objective scoring, rubric reviews, gap critiques.", icon: "🔍" },
                  ].map(a => (
                    <div key={a.id} className="p-3 rounded-xl bg-canvas-dark/60 border border-surface-muted/15 space-y-1 hover:border-surface-muted/30 transition-all">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-[#EEE9DF] flex items-center gap-2">
                          <span>{a.icon}</span>
                          <span>{a.name}</span>
                        </span>
                        <span className="text-[10px] font-mono text-state-success font-bold">READY</span>
                      </div>
                      <p className="text-[11px] text-text-muted leading-tight">{a.desc}</p>
                    </div>
                  ))}
                </div>
              </div>

              {/* Recent Dispatches Feed */}
              <div className="bg-surface-primary/70 border border-surface-muted/25 rounded-2xl p-5 shadow-lg space-y-3.5">
                <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-[#EEE9DF] flex items-center justify-between">
                  <span>Session Activity</span>
                  <span className="text-[10px] font-mono text-text-muted">{history.length} items</span>
                </h3>
                <div className="space-y-2">
                  {history.map((h, i) => (
                    <button
                      key={i}
                      onClick={() => { setCommand(h.cmd); handleExecute(h.cmd); }}
                      className="w-full text-left p-2.5 rounded-xl bg-canvas-dark/40 hover:bg-canvas-dark/80 border border-surface-muted/10 hover:border-accent-primary/40 transition-all space-y-1 block"
                    >
                      <div className="flex items-center justify-between text-[11px]">
                        <span className="font-mono text-accent-primary font-bold">{h.agent}</span>
                        <span className="text-text-muted text-[10px]">{h.time}</span>
                      </div>
                      <p className="text-xs text-text-muted truncate">{h.cmd}</p>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── VIEW 2: MULTI-STEP PIPELINES ──
    function PipelinesView({ onSelectRun }) {
      const [loading, setLoading] = useState(false);
      const [activeRunId, setActiveRunId] = useState(null);
      const [pipelineCmds, setPipelineCmds] = useState({
        apply: "Staff Machine Learning Engineer role at Anthropic",
        publish: "Architecting zero-parameter approval gates with SQLite CAS concurrency",
        research: "Multi-agent fault tolerance and deterministic state recovery"
      });

      const pipelines = [
        {
          id: 'apply',
          title: 'Candidate Application Workflow',
          desc: 'End-to-end job application: tailors resume bullets, drafts personalized cover letter, and requests safety review.',
          icon: '📄',
          badge: 'Career Engine',
          steps: ['Resume Tailoring', 'Cover Letter Draft', 'Quality Critique', 'Approval Queue']
        },
        {
          id: 'publish',
          title: 'Technical Publishing Workflow',
          desc: 'Drafts technical deep-dive, critiques for authenticity, and stages unbypassable approval gate for Dev.to / Hashnode.',
          icon: '📰',
          badge: 'Growth Engine',
          steps: ['Content Generation', 'Editorial Critique', 'Safety Gate Queue', 'External Dispatch']
        },
        {
          id: 'research',
          title: 'Academic Research Synthesis',
          desc: 'Queries arXiv literature, synthesizes methodology, generates structured IEEE critique, and drafts report.',
          icon: '🧪',
          badge: 'Research Engine',
          steps: ['Literature Discovery', 'Paper Synthesis', 'Peer Critique', 'Final Summary']
        }
      ];

      const handleStart = async (pId) => {
        setLoading(true);
        try {
          const res = await api.startPipeline(pId, pipelineCmds[pId]);
          setActiveRunId(res.run_id);
          if (onSelectRun) onSelectRun(res.run_id);
        } catch (err) {
          alert('Failed to start pipeline: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="border-b border-surface-muted/20 pb-5">
            <h2 className="text-2xl font-extrabold text-[#EEE9DF] tracking-tight flex items-center gap-2.5">
              <span>🚀</span> Multi-Step Pipelines
            </h2>
            <p className="text-sm text-text-muted mt-1">
              Deterministic, multi-agent automated workflows audited with step-by-step trace tracking.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {pipelines.map(p => (
              <div
                key={p.id}
                className="bg-surface-primary/80 border border-surface-muted/25 rounded-2xl p-6 shadow-xl flex flex-col justify-between space-y-5 hover:border-accent-primary/40 transition-all"
              >
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="text-2xl">{p.icon}</span>
                    <span className="text-[10px] font-mono font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-accent-primary/20 text-accent-primary border border-accent-primary/30">
                      {p.badge}
                    </span>
                  </div>

                  <div>
                    <h3 className="font-bold text-base text-[#EEE9DF]">{p.title}</h3>
                    <p className="text-xs text-text-muted mt-1 leading-relaxed">{p.desc}</p>
                  </div>

                  {/* Flow Diagram */}
                  <div className="space-y-1.5 pt-2">
                    <span className="text-[10px] font-mono text-text-muted uppercase tracking-wider block">Execution Stages:</span>
                    <div className="flex flex-col gap-1.5">
                      {p.steps.map((st, idx) => (
                        <div key={idx} className="flex items-center gap-2 text-xs font-mono text-text-primary/80 bg-canvas-dark/50 px-2.5 py-1.5 rounded-lg border border-surface-muted/10">
                          <span className="w-4 h-4 rounded-full bg-surface-primary flex items-center justify-center text-[10px] text-accent-primary font-bold">
                            {idx + 1}
                          </span>
                          <span>{st}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Input Parameter */}
                  <div className="space-y-1.5 pt-2">
                    <label className="text-[11px] font-mono text-text-muted uppercase tracking-wider block">Pipeline Prompt:</label>
                    <input
                      type="text"
                      value={pipelineCmds[p.id]}
                      onChange={e => setPipelineCmds({ ...pipelineCmds, [p.id]: e.target.value })}
                      className="w-full bg-canvas-dark border border-surface-muted/30 rounded-lg px-3 py-2 text-xs font-mono text-text-primary focus:outline-none focus:border-accent-primary"
                    />
                  </div>
                </div>

                <button
                  onClick={() => handleStart(p.id)}
                  disabled={loading}
                  className="w-full py-2.5 rounded-xl bg-accent-primary hover:bg-[#ffa347] text-text-onLight font-bold text-xs shadow-lg shadow-accent-primary/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                >
                  <span>Launch Pipeline</span>
                  <span>&rarr;</span>
                </button>
              </div>
            ))}
          </div>

    // ── VIEW 4: APPROVALS QUEUE ──
    function ApprovalsView() {
      const [filter, setFilter] = useState('pending');
      const [approvals, setApprovals] = useState([]);
      const [loading, setLoading] = useState(false);

      const load = async () => {
        setLoading(true);
        try {
          const data = await api.getApprovals(filter);
          setApprovals(data.items || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        load();
        const t = setInterval(load, 5000);
        return () => clearInterval(t);
      }, [filter]);

      const act = async (action, id) => {
        try {
          if (action === 'approve') await api.approve(id);
          if (action === 'reject') await api.reject(id);
          if (action === 'execute') await api.execute(id);
          load();
        } catch (err) {
          alert('Action failed: ' + err.message);

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="border-b border-surface-muted/20 pb-5 space-y-2">

                  <span>🛡️</span> Human-in-the-Loop Safety Gate
                </h2>
                <p className="text-sm text-text-muted mt-1">
                  Sensitive actions queue requiring explicit human authorization. Callers cannot substitute payloads at execution time.
                </p>
              </div>

                {['pending', 'approved', 'executed', 'rejected', 'all'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setFilter(tab)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-mono uppercase font-bold transition-all ${
                      filter === tab ? 'bg-accent-primary text-text-onLight shadow' : 'text-text-muted hover:text-text-primary'
                    }`}
                  >
                    {tab}
                  </button>
                ))}
              </div>
            </div>

            {/* Zero-Parameter Safety Notice */}

              <span>🔒</span>
              <span>
                <strong>Zero-Parameter Guarantee:</strong> `execute_approved(id)` takes no payload argument. The database record is the immutable source of truth.
              </span>
            </div>
          </div>

          {/* Cards List */}
          {approvals.length === 0 ? (
            <div className="p-12 text-center rounded-2xl bg-surface-primary/30 border border-surface-muted/20 space-y-3">
              <span className="text-3xl">🛡️</span>
              <p className="text-sm font-mono text-text-muted">No approval records matching filter "{filter}".</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {approvals.map(appr => (
                <div key={appr.id} className="bg-surface-primary/90 border border-surface-muted/25 rounded-2xl p-5 shadow-xl space-y-4 flex flex-col justify-between">
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-xs font-bold text-accent-primary uppercase px-2 py-0.5 rounded bg-canvas-dark">
                        {appr.action_type}
                      </span>
                      <StatusPill status={appr.status} size="sm" />
                    </div>

                    <div className="text-xs font-mono text-text-muted">
                      ID: #{appr.id.slice(0, 10)}... • Created: {new Date(appr.created_at).toLocaleTimeString()}

                    {/* Formatted Canonical Payload Box */}
                    <div className="bg-canvas-dark rounded-xl p-3 border border-surface-muted/15 font-mono text-[11px] text-text-primary whitespace-pre-wrap max-h-36 overflow-y-auto">

                  {/* Actions */}
                  <div className="pt-2 border-t border-surface-muted/15 flex items-center justify-end gap-2">

                          Approve

                    {appr.status === 'approved' && (
                      <button
                        onClick={() => act('execute', appr.id)}

                          style = isDiag ? 'bg-accent-primary text-text-onLight font-black shadow' : 'bg-state-warning/30 text-surface-primary font-bold';

                        return (
                          <td key={pred} className="p-1">

                    </tr>

              </table>

        </div>

              <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-surface-primary/80 border border-surface-muted/20 text-xs font-mono">
                <span className="flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-state-success animate-pulse" />
                  <span className="text-text-muted">Core API: Online</span>
                </span>
                <span className="text-surface-muted/30">|</span>
                <span className="flex items-center gap-1.5">
                  <span className="text-text-muted">Circuit:</span>
                  <span className={circuitState === 'CLOSED' ? "text-state-success font-bold" : "text-state-danger font-bold"}>
                    {circuitState}
                  </span>
                </span>
              </div>

              <a
                href="/docs"
                target="_blank"
                rel="noreferrer"
                className="px-3 py-1.5 rounded-xl bg-surface-primary hover:bg-surface-primary/80 border border-surface-muted/30 text-xs font-mono text-accent-primary font-bold transition-all"
              >
                Docs &rarr;
              </a>
            </div>
          </header>

          {/* Mobile Tab Bar */}
          <div className="md:hidden flex overflow-x-auto bg-surface-primary border-b border-surface-muted/20 p-2 gap-1">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => { setTab(item.id); if (item.id === 'pipelines') setRunId(null); }}
                className={`flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold ${
                  tab === item.id ? 'bg-accent-primary text-text-onLight' : 'text-text-muted'
                }`}
              >
                <span>{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </div>

          {/* Main Stage */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
            {tab === 'dispatch' && <DispatchView />}
            {tab === 'pipelines' && <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />}
            {tab === 'runs' && (runId ? <RunDetailView runId={runId} onBack={() => setTab('pipelines')} /> : <PipelinesView onSelectRun={id => { setRunId(id); setTab('runs'); }} />)}
            {tab === 'approvals' && <ApprovalsView />}
            {tab === 'eval' && <EvalView />}
            {tab === 'diagnostics' && <DiagnosticsView />}
          </main>

          {/* Sleek Minimal Footer */}
          <footer className="border-t border-surface-muted/15 py-4 px-6 text-center text-xs font-mono text-text-muted">
            Orchestrator Agent v2 Core Service • MP072 Palette • Audited Concurrency & Security Invariants
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
