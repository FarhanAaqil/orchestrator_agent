name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check orchestrator_core/ tests/

      - name: CI Guard — Check forbidden experimental imports
        run: |
          echo "Verifying orchestrator_core has no imports from experimental..."
          if grep -rn "from experimental" orchestrator_core/; then
            echo "ERROR: Found forbidden imports from experimental in orchestrator_core!"
            exit 1
          fi
          if grep -rn "import experimental" orchestrator_core/; then
            echo "ERROR: Found forbidden imports from experimental in orchestrator_core!"
            exit 1
          fi
          echo "Clean: Zero experimental imports found."

      - name: Run test suite (excluding live LLM)
        run: |
          pytest -m "not real_llm" -v