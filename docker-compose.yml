version: '3.8'

services:
  # ── Backend Orchestrator API Service ─────────────────────────────────────────
  orchestrator:
    build: .
    container_name: aaqil_orchestrator
    expose:
      - "8000"
    ports:
      # Optional direct debug binding to localhost only
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./database:/app/database
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx Load Balancer & Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aaqil_nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped

