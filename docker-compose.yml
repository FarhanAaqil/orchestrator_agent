version: '3.8'

services:
  orchestrator:
    build: .
    container_name: aaqil_orchestrator
    ports:
      # Bind to localhost only — do not expose to 0.0.0.0 without an
      # authenticated reverse proxy or bearer-token middleware in place.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./aaqil.db:/app/aaqil.db
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
