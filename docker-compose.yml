services:
  orchestrator_core:
    build: .
    container_name: toji_orchestrator_core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
    volumes:
      - orchestrator_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  orchestrator_data:
