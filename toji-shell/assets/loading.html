<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Toji — Starting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width:  460px;
      height: 720px;
      background: #0F172A;
      color: #94A3B8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      overflow: hidden;
      border-radius: 12px;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* ── Animated orb ── */
    .orb-wrap {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .orb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FCD34D, #D97706 55%, #92400E 100%);
      box-shadow: 0 0 40px rgba(217, 119, 6, 0.5),
                  0 0 80px rgba(217, 119, 6, 0.2);
      animation: orb-pulse 2.4s ease-in-out infinite;
    }

    .orb-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid rgba(217, 119, 6, 0.3);
      animation: ring-grow 2.4s ease-out infinite;
    }

    .orb-ring:nth-child(2) {
      inset: -20px;
      border-color: rgba(217, 119, 6, 0.15);
      animation-delay: 0.6s;
    }

    @keyframes orb-pulse {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 30px rgba(217,119,6,0.4); }
      50%       { transform: scale(1.06); box-shadow: 0 0 50px rgba(217,119,6,0.7); }
    }

    @keyframes ring-grow {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0;   }
    }

    /* ── Text ── */
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: #475569;
      letter-spacing: 0.5px;
    }

    /* ── Dots loader ── */
    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #D97706;
      animation: dot-bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }

    /* ── Status line ── */
    #status-text {
      font-size: 11px;
      color: #334155;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="orb-wrap">
    <div class="orb-ring"></div>
    <div class="orb-ring"></div>
    <div class="orb"></div>
  </div>

  <div class="title">Toji</div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="subtitle">Starting backend…</div>
  <div id="status-text">polling /health</div>

  <script>
    // Cycle through loading messages while sidecar boots
    const messages = [
      'polling /health',
      'waiting for uvicorn…',
      'loading agents…',
      'almost ready…',
    ];
    let idx = 0;
    const el = document.getElementById('status-text');
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      el.textContent = messages[idx];
    }, 1800);
  </script>
</body>
</html>
