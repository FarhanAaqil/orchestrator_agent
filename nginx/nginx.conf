# ==============================================================================
# Orchestrator Agent — Production Nginx Reverse Proxy, Load Balancer & Edge Cache
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream latency tracking
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed;

    # High performance I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Client buffer sizes
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Rate Limiting & Connection Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Microcache / CDN Cache Zone for Static Assets
    proxy_cache_path /var/cache/nginx/orchestrator
                     levels=1:2
                     keys_zone=EDGE_CACHE:10m
                     max_size=500m
                     inactive=7d
                     use_temp_path=off;

    # --------------------------------------------------------------------------
    # Load Balancer Upstream Cluster
    # Uses least_conn algorithm with passive health checks and keepalive pooling
    # --------------------------------------------------------------------------
    upstream orchestrator_backend {
        least_conn;
        server orchestrator:8000 max_fails=3 fail_timeout=10s;
        # Scalable replica slots for container clustering:
        # server orchestrator_replica:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Health Check Endpoint (Bypasses logging & rate limiting)
        location = /health {
            proxy_pass http://orchestrator_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Static Assets & CDN Edge Caching (7-Day TTL with Stale-While-Revalidate)
        location /static/ {
            proxy_pass http://orchestrator_backend/static/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_cache EDGE_CACHE;
            proxy_cache_valid 200 302 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_revalidate on;
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Interactive Routing & Dispatch Endpoints (Rate limited + Streaming Unbuffered)
        location ~ ^/(route|dispatch|pipeline) {
            limit_req zone=api_limit burst=15 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://orchestrator_backend;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Default Catch-all Proxy (UI & API docs)
        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://orchestrator_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
